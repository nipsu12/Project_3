<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musiikin tietäjät - jQuery & Kirjastot</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Ulkoiset kirjastot: jQuery, Chart.js ja SweetAlert2 -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <div class="container">
    <h1>Artisti- & Albumihaku</h1>
    
    <div class="search-section">
      <label for="artist-select">Valitse artisti:</label>
      <select id="artist-select">
        <option value="">-- Valitse listalta --</option>
        <option value="Coldplay">Coldplay</option>
        <option value="Queen">Queen</option>
        <option value="Dua Lipa">Dua Lipa</option>
        <option value="Nightwish">Nightwish</option>
      </select>

      <span class="divider">tai</span>

      <input type="text" id="artist-input" placeholder="Kirjoita artistin nimi...">
      <button id="search-btn">Hae</button>
    </div>

    <!-- Tilaviestit (latausilmoituksille) -->
    <div id="status-message"></div>

    <!-- Artistin perustiedot (piilotettu aluksi, näytetään fadeIn-efektillä) -->
    <div id="artist-info" class="artist-card" style="display: none;"></div>

    <!-- Chart.js -kaavio albumien kuuntelukerroille -->
    <div id="chart-wrapper" class="chart-card" style="display: none;">
      <h2>Suosituimmat albumit (Kuuntelukerrat)</h2>
      <canvas id="albums-chart"></canvas>
    </div>

    <!-- Albumilistaus -->
    <h2 id="albums-heading" style="display: none;">Albumit</h2>
    <div id="albums-container" class="grid-container"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
